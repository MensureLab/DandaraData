[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dandaradata-next"
version = "0.1.0"
description = "Pipeline experimental de correspondencia de artigos e comunidades quilombolas"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
dandaradata-next = "dandaradata.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
